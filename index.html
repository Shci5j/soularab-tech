<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULARAB TECH - Royal System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="dark-theme" style="background-color: #000; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0;">

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" style="display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw;">
        <div style="background: #111; border: 2px solid #d4af37; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);">
            <h1 style="color: #d4af37; margin-bottom: 5px;">SOULARAB TECH</h1>
            <p style="color: #aaa; font-size: 12px; margin-bottom: 20px;">IDEAS INTO DIGITAL REALITY</p>
            
            <h2 style="color: #fff; font-size: 18px; margin-bottom: 20px;">تسجيل الدخول</h2>
            
            <input type="text" id="username" value="aboarap" style="width: 100%; padding: 12px; margin-bottom: 15px; background: #222; border: 1px solid #d4af37; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center;">
            
            <input type="password" id="password" value="aa1994" style="width: 100%; padding: 12px; margin-bottom: 20px; background: #222; border: 1px solid #d4af37; color: #fff; border-radius: 8px; box-sizing: border-box; text-align: center;">
            
            <button onclick="forceLogin()" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #d4af37, #aa7c11); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px;">دخول للمملكة البرمجية</button>
        </div>
    </div>

    <!-- الواجهة الرئيسية (تظهر بعد الدخول) -->
    <div id="main-screen" style="display: none; padding: 20px;">
        <h1 style="color: #d4af37; text-align: center;">أهلاً بك في لوحة تحكم المملكة البرمجية</h1>
        <div style="display: flex; justify-content: center; gap: 15px; margin-top: 40px; flex-wrap: wrap;">
            <div style="background: #111; border: 1px solid #d4af37; padding: 20px; border-radius: 10px; width: 150px; text-align: center; cursor: pointer;" onclick="alert('قسم الأقسام')">
                <i class="fa-solid fa-cubes fa-2x" style="color: #d4af37; margin-bottom: 10px;"></i>
                <h3>الأقسام</h3>
            </div>
            <div style="background: #111; border: 1px solid #d4af37; padding: 20px; border-radius: 10px; width: 150px; text-align: center; cursor: pointer;" onclick="alert('قسم الذكاء الاصطناعي')">
                <i class="fa-solid fa-wand-magic-sparkles fa-2x" style="color: #d4af37; margin-bottom: 10px;"></i>
                <h3>الذكاء</h3>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
