<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOULARAB TECH - Royal Hub</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="dark-theme">

    <!-- 1. شاشة تسجيل الدخول الأولى (تظهر عند التثبيت أو الخمول لمدة 24 ساعة) -->
    <div id="login-screen" class="screen-overlay">
        <div class="login-frame">
            <!-- الشعار الملكي باللون الأبيض -->
            <div class="white-logo">
                <i class="fa-solid fa-shield-halved"></i>
                <h2>SOULARAB TECH</h2>
                <small>IDEAS INTO DIGITAL REALITY</small>
            </div>
            
            <h3 class="welcome-text">أهلاً بك أيها المطور المبدع</h3>
            <h2 class="login-title">تسجيل الدخول</h2>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="ribbon-input">
                    <input type="text" id="username" placeholder="الاسم المستعار / البريد الإلكتروني" required>
                </div>
                <div class="ribbon-input">
                    <input type="password" id="password" placeholder="كلمة السر" required>
                </div>
                <button type="submit" class="btn-royal-submit">دخول للمملكة البرمجية</button>
            </form>

            <p class="footer-quote">مشوار الألف ميل يبدأ بخطوة</p>
        </div>
    </div>

    <!-- 2. شاشة تفعيل الأمان والبصمة (بعد التسجيل لأول مرة) -->
    <div id="security-setup-screen" class="screen-overlay hidden">
        <div class="login-frame">
            <i class="fa-solid fa-fingerprint gold-icon-lg"></i>
            <h2>تأمين التطبيق الملكي</h2>
            <p>يرجى ضبط رمز الـ PIN الخاص بك وتفعيل البصمة لحماية بيانات المشاريع</p>
            <div class="ribbon-input">
                <input type="password" id="setup-pin" maxlength="6" placeholder="رمز الـ PIN الخاص (6 أرقام)" required>
            </div>
            <button class="btn-royal-submit" onclick="enableBiometricsAndFinish()">تفعيل البصمة والدخول</button>
        </div>
    </div>

    <!-- 3. الواجهة الرئيسية (Main Screen) -->
    <div id="main-screen" class="main-wrapper hidden">
        
        <!-- الهيدر العلوي وشريط البحث -->
        <header class="top-header">
            <div class="header-right">
                <div class="search-bar-frame">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="ماذا تريد أن تفعل اليوم يا زعيم" id="global-search">
                    <div class="header-controls">
                        <button title="تبديل اللغة" onclick="toggleLanguage()"><i class="fa-solid fa-language"></i></button>
                        <button title="الوضع الفاتح" onclick="setTheme('light')"><i class="fa-solid fa-sun"></i></button>
                        <button title="الوضع الغامق" onclick="setTheme('dark')"><i class="fa-solid fa-moon"></i></button>
                    </div>
                </div>
                <span class="date-badge" id="current-date"></span>
            </div>
            <div class="header-left">
                <i class="fa-solid fa-shield-halved logo-shield-only"></i>
            </div>
        </header>

        <!-- جسم الصفحة الرئيسية -->
        <main class="dashboard-body">
            
            <!-- القائمة الجانبية اليمنى (الأزرار الثلاثة) -->
            <div class="side-menu-buttons">
                <button class="menu-btn" onclick="openModal('logs-modal')">
                    <i class="fa-solid fa-clock-rotate-left"></i> مراجعة سجل التغيرات
                </button>
                <button class="menu-btn" onclick="openModal('settings-modal')">
                    <i class="fa-solid fa-sliders"></i> الإعدادات العامة
                </button>
                <button class="menu-btn" onclick="openSection('rouh-chat')">
                    <i class="fa-solid fa-headset"></i> السكرتيرة روح
                </button>
            </div>

            <!-- الأقسام الـ 4 الدائرية الأساسية -->
            <div class="main-circles-grid">
                <div class="royal-circle-btn" onclick="openSection('sections-page')">
                    <div class="circle-inner">
                        <span>الأقسام</span>
                    </div>
                </div>

                <div class="royal-circle-btn" onclick="openSection('whatsapp-section')">
                    <div class="circle-inner">
                        <span>الواتساب</span>
                    </div>
                </div>

                <div class="royal-circle-btn" onclick="openSection('private-section')">
                    <div class="circle-inner">
                        <span>خاص</span>
                    </div>
                </div>

                <div class="royal-circle-btn" onclick="openSection('ai-summon-section')">
                    <div class="circle-inner">
                        <span>استدعاء الذكاء</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 4. صفحة الأقسام الفرعية (Sections Page) -->
    <div id="sections-page" class="sub-page hidden">
        <header class="sub-header">
            <div class="sub-header-left">
                <button class="ai-summon-icon-btn" title="استدعاء الذكاء للقسم" onclick="openSection('ai-summon-section')">
                    <i class="fa-solid fa-brain"></i>
                    <span>استدعاء الذكاء</span>
                </button>
            </div>
            <div class="sub-header-center">
                <div class="search-bar-frame">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="بحث داخل الأقسام...">
                    <div class="header-controls">
                        <button onclick="toggleLanguage()"><i class="fa-solid fa-language"></i></button>
                        <button onclick="setTheme('light')"><i class="fa-solid fa-sun"></i></button>
                        <button onclick="setTheme('dark')"><i class="fa-solid fa-moon"></i></button>
                    </div>
                </div>
            </div>
            <div class="sub-header-right">
                <h1 class="page-title">الأقسام</h1>
                <i class="fa-solid fa-shield-halved logo-shield-only"></i>
                <button class="back-home-btn" onclick="openSection('main-screen')"><i class="fa-solid fa-house"></i> الرئيسية</button>
            </div>
        </header>

        <div class="sections-content">
            <!-- قسم التصميم والأدوات -->
            <div class="section-group">
                <div class="group-title-banner">قسم التصميم والأدوات</div>
                <div class="circles-row">
                    <div class="gold-sparkle-circle" onclick="alert
