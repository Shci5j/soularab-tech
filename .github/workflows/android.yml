name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/**"
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  android:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Install web and Capacitor dependencies
        run: npm install
      - name: Build web application
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Android loopback backend access
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          text = text.replace('android:allowBackup="false"', 'android:allowBackup="false" android:usesCleartextTraffic="true"')
          if "android:usesCleartextTraffic" not in text:
              text = text.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(text)
          PY
      - name: Sync web assets and native plugins
        run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: soularab-tech-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
