name: Build and validate

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build

  backend:
    name: Backend syntax and import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q backend/app
      - name: Run backend unit tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -v

  containers:
    name: Validate self-hosted containers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deployment environment
        run: cp .env.docker.example .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build application containers
        run: docker compose build backend frontend
