services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SOULARAB_ENV: production
      SOULARAB_DATA_DIR: /data
      SOULARAB_CORS_ORIGINS: ${SOULARAB_CORS_ORIGINS:-http://localhost:8080,https://soularab.pages.dev,https://localhost,capacitor://localhost}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL:-http://127.0.0.1:8081}
      LLAMA_CPP_TIMEOUT_SECONDS: ${LLAMA_CPP_TIMEOUT_SECONDS:-180}
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-http://127.0.0.1:8188}
      WHISPER_CPP_BASE_URL: ${WHISPER_CPP_BASE_URL:-http://127.0.0.1:8080}
      SOULARAB_ALLOW_DOCKER_MEDIA: ${SOULARAB_ALLOW_DOCKER_MEDIA:-false}
      SOULARAB_MEDIA_TIMEOUT_SECONDS: ${SOULARAB_MEDIA_TIMEOUT_SECONDS:-180}
    volumes:
      - soularab_data:/data
    restart: unless-stopped
    networks:
      - soularab_internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - soularab_internal

volumes:
  soularab_data:

networks:
  soularab_internal:
    name: soularab_internal
    driver: bridge
