services:
  - type: web
    name: soularab-tech-api
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: soularab-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SOULARAB_ENV
        value: production
      - key: SOULARAB_DATA_DIR
        value: /data
      - key: SOULARAB_API_TOKEN
        generateValue: true
      - key: SOULARAB_CORS_ORIGINS
        value: https://soularab.pages.dev,https://localhost,capacitor://localhost
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: COMFYUI_BASE_URL
        value: http://127.0.0.1:8188
      - key: WHISPER_CPP_BASE_URL
        value: http://127.0.0.1:8080
